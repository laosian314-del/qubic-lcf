name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn pulp pytest

      - name: Run tests
        run: pytest -q
        # Optional solver backends (ortools, dimod, dwave-tabu, torch) are
        # intentionally not installed here; tests that need them skip.
